name: Static audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and links
        run: |
          test -f index.html
          test -f README.md
          test -f LICENSE
          test -f CITATION.cff
          test -f docs/guide.md
          test -f references/Beyond_skyrmions_Physics_Reports_895_2021.pdf
          grep -q 'const TEXTURES' index.html
          ! grep -R 'YOUR_GITHUB_USERNAME\|topological-magnetic-texture-atlas\|skyrmion_help_v50' README.md docs index.html CITATION.cff
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check markdown math rendering constraints
        run: node scripts/check-markdown-math.mjs
      - name: Check preset count
        run: |
          count=$(grep -o '<option value=' index.html | wc -l | tr -d ' ')
          test "$count" = "13"

  browser:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            test-results/
            playwright-report/
          if-no-files-found: ignore
