name: Refresh Zhihu Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zhihu-cli
        run: |
          curl -fsSL -o zhihu-cli.tar.gz "https://developer-cdn.zhihu.com/zhihu-cli/releases/stable/cli/0.2.0/zhihu-cli-0.2.0-darwin-arm64.tar.gz"
          tar -xzf zhihu-cli.tar.gz
          sudo install -m 0755 zhihu-cli /usr/local/bin/zhihu-cli
          echo "ZHIHU_CLI=zhihu-cli" >> "$GITHUB_ENV"
          zhihu-cli me contents --type all --limit 1 > /dev/null
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch and build
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
        run: |
          python3 zhihu-sync/src/fetch_contents.py --force
          python3 zhihu-sync/src/build.py --mapping zhihu-sync/config/mappings.yaml --cache zhihu-sync/data/contents.json --out zhihu-sync/output --history zhihu-sync/output/history.json
          cp zhihu-sync/output/zhihu-stats.json zhihu-stats.json
          cp zhihu-sync/output/trend.svg trend.svg
          cp zhihu-sync/output/badges/*.svg badges/
      - name: Run tests and validate
        run: |
          python3 zhihu-sync/tests/test_build.py
          python3 zhihu-sync/tests/validate_outputs.py --out zhihu-sync/output
      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zhihu-stats.json trend.svg badges/ zhihu-sync/output
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            MSG="$(sed -n '3p' zhihu-sync/output/CHANGES.md | sed 's/^[ *-]*//')"
            git commit -m "chore: refresh zhihu stats — ${MSG:-更新数据}"
            git push
          fi
